<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns:dc="http://purl.org/dc/elements/1.1/"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns="http://www.w3.org/2000/svg"
   width="38"
   height="38"
   viewBox="0 0 24 24"
>
    <!-- create a note triplet -->
    <!-- TODO: just use an ellipse for the noteheads instead of arc? -->
    <path 
        d="
            M 4 3
            l 19 0
            M 4 4
            l 19 0
            
            M 4 3
            l 0 14
            M 5 3
            l 0 14
            
            M 13 3
            l 0 14
            M 14 3
            l 0 14
            
            M 23 3
            l 0 14
            M 24 3
            l 0 14
            
            M 2.5 15
            a 2.5 1.5 0 1 0 1 0
            
            M 11.5 15
            a 2.5 1.5 0 1 0 1 0
            
            M 20.5 15
            a 2.5 1.5 0 1 0 1 0
            "
        stroke="#555"
        stroke-linejoin="round"
        fill="#555"
    />
    
    <!-- loop around the notes -->
    <path
        d="
            M 3 8 C 4 13, 22.5 13, 24 8
            
            M 4 8
            l 8.5 -0.3

            M 13.5 7.5
            l 9 0.3
            "
        stroke="blue"
        stroke-linejoin="round"
        fill="transparent"
    />
            
</svg>

